<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indwe Risk Services - Sponsored Banner</title>
<style>
  @font-face {
    font-family: 'Arial Narrow';
    src: url('ArialNarrow.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Arial Narrow';
    src: url('ArialNarrowBold.ttf') format('truetype');
    font-weight: bold;
    font-style: normal;
    font-display: swap;
  }

  /*
   * Three slides on a 15s loop, built like a billboard: one idea per slide,
   * type that reads from across a room, and one action. The sponsor slide
   * stays white so the logo is on brand; the two message slides go deep
   * Indwe blue with white type for contrast. Three things say "tap me" on
   * every slide: a WhatsApp-green pill, a corner chat chip while the pill is
   * off screen, and a progress line along the bottom that shows the banner
   * is live. The whole banner is one link to WhatsApp.
   */
  :root {
    --indwe: #0066a2;
    --indwe-deep: #063b60;
    --indwe-night: #032740;
    --sky: #9fdcff;
    --wa: #25d366;
    --wa-dark: #1ebe5d;
    --white: #ffffff;
    --loop: 15s;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    background: #ffffff;
    display: flex;
    align-items: stretch;
    justify-content: stretch;
    min-height: 100vh;
  }

  .banner {
    width: 100%;
    height: 100%;
    min-height: 100vh;
    max-width: 1280px;
    margin: 0 auto;
    background: #ffffff;
    overflow: hidden;
    position: relative;
    font-family: 'Arial Narrow', Arial, Helvetica, sans-serif;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- Slides ---------- */
  .slide {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    opacity: 0;
    animation-duration: var(--loop);
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }

  /* 1 · Sponsor — white, logo breathing slowly */
  .slide-sponsor { animation-name: show-1; background: #ffffff; }
  .slide-sponsor picture { display: block; width: 100%; height: 100%; }
  .slide-sponsor img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 3% 5%;
    animation: breathe var(--loop) ease-in-out infinite;
  }
  @media (max-width: 640px) {
    /* Room at the foot for the chat chip and the progress line */
    .slide-sponsor img { padding: 10px 12px 30px; }
  }

  /* 2 & 3 · Message slides — deep blue with a soft spotlight */
  .slide-blue {
    background:
      radial-gradient(120% 140% at 18% 0%, rgba(159, 220, 255, 0.28), transparent 55%),
      radial-gradient(90% 120% at 100% 100%, rgba(0, 102, 162, 0.9), transparent 60%),
      linear-gradient(135deg, var(--indwe-night) 0%, var(--indwe-deep) 55%, var(--indwe) 100%);
    color: var(--white);
    padding: 4% 8%;
    gap: clamp(6px, 1.2vw, 14px);
  }
  .slide-copy { animation-name: show-2; }
  .slide-cta { animation-name: show-3; }

  .eyebrow {
    font-size: clamp(9px, 1.1vw, 14px);
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.65);
  }

  .headline {
    font-size: clamp(22px, 5vw, 60px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
    text-wrap: balance;
  }
  .headline .accent { color: var(--sky); }

  .sub {
    font-size: clamp(13px, 1.9vw, 24px);
    font-weight: 700;
    color: var(--sky);
    letter-spacing: 0.5px;
  }

  .signoff {
    font-size: clamp(9px, 1.05vw, 13px);
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.55);
  }

  /* Lines rise in one after the other when the slide arrives */
  .slide-copy .rise, .slide-cta .rise {
    animation: rise var(--loop) ease-out infinite;
  }
  .slide-copy .rise:nth-child(1) { animation-delay: 0s; }
  .slide-copy .rise:nth-child(2) { animation-delay: 0.12s; }
  .slide-copy .rise:nth-child(3) { animation-delay: 0.24s; }
  .slide-cta .rise { animation-name: rise-3; }
  .slide-cta .rise:nth-child(1) { animation-delay: 0s; }
  .slide-cta .rise:nth-child(2) { animation-delay: 0.12s; }
  .slide-cta .rise:nth-child(3) { animation-delay: 0.24s; }
  .slide-cta .rise:nth-child(4) { animation-delay: 0.36s; }

  /* ---------- The action: a WhatsApp-green pill ---------- */
  .pill {
    display: inline-flex;
    align-items: center;
    gap: clamp(6px, 0.8vw, 12px);
    padding: clamp(8px, 1.1vw, 15px) clamp(18px, 2.6vw, 36px);
    border-radius: 999px;
    background: var(--wa);
    color: var(--white);
    font-family: 'Arial Narrow', Arial, Helvetica, sans-serif;
    font-size: clamp(13px, 1.6vw, 22px);
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    text-decoration: none;
    box-shadow: 0 10px 30px -8px rgba(37, 211, 102, 0.7), 0 0 0 0 rgba(37, 211, 102, 0.5);
    animation: pulse 2.2s ease-in-out infinite;
    transition: background 0.25s ease, transform 0.25s ease;
    margin-top: clamp(2px, 0.6vw, 8px);
  }
  .pill svg { width: 1.15em; height: 1.15em; flex-shrink: 0; }
  .banner:hover .pill { background: var(--wa-dark); transform: translateY(-1px) scale(1.03); }

  /* ---------- Persistent tap cues ---------- */
  /* Corner chip: on screen while the pill is not */
  .chip {
    position: absolute;
    right: clamp(8px, 1.2vw, 16px);
    bottom: clamp(10px, 1.4vw, 18px);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px 5px 8px;
    border-radius: 999px;
    background: var(--wa);
    color: var(--white);
    font-size: clamp(10px, 1.05vw, 13px);
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    box-shadow: 0 6px 18px -6px rgba(0, 0, 0, 0.35);
    animation: chip var(--loop) ease-in-out infinite;
    z-index: 2;
    pointer-events: none;
  }
  .chip svg { width: 1.2em; height: 1.2em; }

  /* Progress line: one sweep per loop, so the banner reads as live */
  .progress {
    position: absolute;
    left: 0;
    bottom: 0;
    height: 3px;
    width: 100%;
    background: rgba(0, 0, 0, 0.08);
    z-index: 2;
  }
  .progress::after {
    content: "";
    position: absolute;
    inset: 0;
    width: 0;
    background: var(--wa);
    animation: sweep var(--loop) linear infinite;
  }

  /* ---------- Timing: 0–4.5s sponsor · 4.5–9.5s copy · 9.5–14.5s cta ---------- */
  @keyframes show-1 {
    0%   { opacity: 1; }
    30%  { opacity: 1; }
    33%  { opacity: 0; }
    97%  { opacity: 0; }
    100% { opacity: 1; }
  }
  @keyframes show-2 {
    0%   { opacity: 0; }
    33%  { opacity: 0; }
    36%  { opacity: 1; }
    63%  { opacity: 1; }
    66%  { opacity: 0; }
    100% { opacity: 0; }
  }
  @keyframes show-3 {
    0%   { opacity: 0; }
    66%  { opacity: 0; }
    69%  { opacity: 1; }
    97%  { opacity: 1; }
    100% { opacity: 0; }
  }
  /* Lines start 10px low and settle as their slide fades in */
  @keyframes rise {
    0%, 33%  { transform: translateY(10px); opacity: 0; }
    38%, 63% { transform: translateY(0); opacity: 1; }
    66%, 100% { transform: translateY(10px); opacity: 0; }
  }
  @keyframes rise-3 {
    0%, 66%  { transform: translateY(10px); opacity: 0; }
    71%, 97% { transform: translateY(0); opacity: 1; }
    100%     { transform: translateY(10px); opacity: 0; }
  }
  @keyframes chip {
    0%, 63%   { opacity: 1; transform: translateY(0); }
    66%, 97%  { opacity: 0; transform: translateY(6px); }
    100%      { opacity: 1; transform: translateY(0); }
  }
  @keyframes breathe {
    0%, 33%, 100% { transform: scale(1); }
    16%            { transform: scale(1.035); }
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 10px 30px -8px rgba(37, 211, 102, 0.7), 0 0 0 0 rgba(37, 211, 102, 0.55); }
    50%      { box-shadow: 0 10px 30px -8px rgba(37, 211, 102, 0.9), 0 0 0 10px rgba(37, 211, 102, 0); }
  }
  @keyframes sweep {
    from { width: 0; }
    to   { width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .slide-sponsor img, .pill, .rise { animation: none !important; opacity: 1; transform: none; }
    .chip { animation: chip var(--loop) step-end infinite; }
  }
</style>
</head>
<body>

<div class="banner"
     onclick="window.open('https://wa.me/27600190112?text=Hi%20Indwe%2C%20I%27d%20like%20to%20chat%20about%20insurance.', '_blank')"

  <div class="slide slide-sponsor">

      <img src="indwe-sponsor-banner.png" alt="Proudly Sponsored By Indwe Risk Services – Authorised Financial Services Provider FSP 3425" />

</div>
